# The single place a version is written down (AGENTS.md §9.6: no dependency is added
# without being named in the commit body and pinned here).
#
# kotlin matches the version the upstream app pins (app/gradle/libs.versions.toml), so the
# ported sources and their upstream copies see the same language and stdlib. The Compose
# *compiler* plugin is versioned with Kotlin itself since 2.0 and is pinned to `kotlin`
# exactly; `compose` below is the runtime/UI release, which is a separate line.

[versions]
kotlin = "2.4.10"
compose = "1.12.2"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.5.0"
# The real org.json, at the version upstream itself names for JVM runs. Needed for real here,
# not just for tests: the ported service parses every HTTP response with JSONObject, and
# SettingsManager's legacy migrations and legacy-backup reader use it so that what this port
# reads is byte-for-byte what the phone wrote. Rewriting those parses against
# kotlinx-serialization would change the interop guarantee that importing an Android backup
# depends on (PLAN.md §7, SettingsManager).
orgjson = "20240303"
# Deliberately 1.19.2, not the latest: upstream uses onnxruntime-android at this version,
# and the whole point of seam 4 (PLAN.md §5) is that the VAD code is the same code with a
# different artifact behind it. Drift here would mean re-tuning the detector.
onnxruntime = "1.19.2"
junit = "4.13.2"
# Coil 3, at the version the upstream app pins for the same dependency (app/gradle/
# libs.versions.toml, `coil = "3.1.0"`). Upstream declares io.coil-kt.coil3:coil-compose there;
# this is that same coordinate, and nothing else.
coil = "3.1.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Only so that the COPY file Models.kt can stay byte-identical: it carries
# androidx.compose.ui.graphics.Color in its persisted settings schema (PLAN.md §7a). Pinned to
# `compose` rather than its own version on purpose — :desktop resolves this artifact through the
# Compose plugin at that same version, and a skew would put two different Color classes on the
# classpath, which fails at runtime and not at compile time. Do not give this its own version.
compose-ui-graphics = { module = "org.jetbrains.compose.ui:ui-graphics", version.ref = "compose" }

# Coil 3 for desktop images: the persona list, message attachments and generated images.
#
# **Deliberately WITHOUT `coil-network-okhttp` or any other fetcher.** Coil 3 splits the loader
# from its network stacks on purpose, and this port wants only the local half: every image it
# displays is a file the application already owns in `dataDir` or `cacheDir` — persona artwork,
# a message attachment, a generated image. Adding a fetcher would give the UI the ability to make
# a network call nothing asked it to make (AGENTS.md §5: "no network call that the user did not
# configure"), and the images would come from disk anyway. Verified against the resolved tree in
# the commit that added this; if a fetcher ever appears transitively, that is a bug.
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
org-json = { module = "org.json:json", version.ref = "orgjson" }
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
